<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#F4F5F6"/>
      <stop offset="0.55" stop-color="#CDD1D5"/>
      <stop offset="1" stop-color="#A8AEB4"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="18"/></filter>
    <g id="screw">
      <circle r="26" fill="#DADDE0" stroke="#8E959C" stroke-width="4"/>
      <line x1="-15" y1="0" x2="15" y2="0" stroke="#6B7279" stroke-width="7" stroke-linecap="round"/>
    </g>
    <g id="pane">
      <rect y="5" width="252" height="252" rx="30" fill="#FFFFFF" fill-opacity="0.75"/>
      <rect width="252" height="252" rx="30" fill="#6E757C"/>
      <rect x="16" y="16" width="220" height="220" rx="18" fill="#12171C"/>
    </g>
  </defs>

  <rect x="100" y="120" width="824" height="824" rx="186" fill="#000000" opacity="0.3" filter="url(#shadow)"/>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#body)"/>
  <rect x="102" y="102" width="820" height="820" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.8" stroke-width="4"/>

  <use href="#screw" transform="translate(180 180) rotate(20)"/>
  <use href="#screw" transform="translate(844 180) rotate(-35)"/>
  <use href="#screw" transform="translate(180 844) rotate(70)"/>
  <use href="#screw" transform="translate(844 844) rotate(-10)"/>

  <g transform="translate(236 236)">
    <use href="#pane"/>
    <polyline points="62,98 108,126 62,154" fill="none" stroke="#FFA62B" stroke-width="24" stroke-linecap="square" stroke-linejoin="miter"/>
    <rect x="136" y="92" width="40" height="64" fill="#FFA62B"/>
  </g>
  <g transform="translate(536 236)" fill="#33404B">
    <use href="#pane"/>
    <rect x="48" y="84" width="116" height="18" rx="3"/>
    <rect x="48" y="118" width="156" height="18" rx="3"/>
    <rect x="48" y="152" width="84" height="18" rx="3"/>
  </g>
  <g transform="translate(236 536)" fill="#33404B">
    <use href="#pane"/>
    <rect x="48" y="84" width="148" height="18" rx="3"/>
    <rect x="48" y="118" width="96" height="18" rx="3"/>
    <rect x="48" y="152" width="132" height="18" rx="3"/>
  </g>
  <g transform="translate(536 536)" fill="#33404B">
    <use href="#pane"/>
    <rect x="48" y="84" width="104" height="18" rx="3"/>
    <rect x="48" y="118" width="156" height="18" rx="3"/>
    <rect x="48" y="152" width="120" height="18" rx="3"/>
  </g>

  <circle cx="512" cy="862" r="22" fill="#FFA62B" opacity="0.25"/>
  <circle cx="512" cy="862" r="10" fill="#FFA62B"/>
</svg>
